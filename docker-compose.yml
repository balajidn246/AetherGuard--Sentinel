version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aetherguard-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aetherguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aetherguard_secure_2024}
      POSTGRES_DB: ${POSTGRES_DB:-aetherguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aetherguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest-alpine
    container_name: aetherguard-clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-aetherguard}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-aetherguard_secure_2024}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-aetherguard}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: aetherguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: aetherguard-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          memory: 2G
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: aetherguard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: aetherguard-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data:
